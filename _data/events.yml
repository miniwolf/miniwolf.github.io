# Events data file
# Each event is a list item. Order here = order on the page.
# Set active: false to hide an event without deleting it.
# Set featured: true to show in the featured section at the top.
#
# Fields:
#   id            - unique identifier (for reference only)
#   active        - true/false, controls visibility
#   featured      - true/false, renders in featured section vs regular grid
#   type          - badge CSS class: weekend, workshop, seminar, special, camp
#   categories    - list of filter values: upcoming, weekend, camp, workshop, seminar
#   image         - local path (/images/events/...) or external URL (https://...)
#   location      - venue name
#   price         - price string (fallback if no price_label in language)
#   spots         - number of spots
#   time          - language-independent time (used if no language-specific time)
#   registration_url - optional external registration link
#   da:/en:       - language-specific fields:
#     badge         - badge label text
#     title         - event title
#     date          - date display text
#     description   - event description (HTML allowed)
#     time          - language-specific time override (optional)
#     price_label   - translated price text (optional, falls back to top-level price)
#     spots_label   - translated spots text
#     alt           - image alt text (optional, falls back to title)

