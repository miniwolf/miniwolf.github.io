# About page
about:
  page_title: "Om Tai Chi"
  page_subtitle: "Forståelse af denne ældgamle kunsts sande kampnatur"

  what_is_title: "Hvad er Praktisk Tai Chi Chuan?"
  what_is_intro: "Tai Chi Chuan (Den Højeste Ultimative Næve) er et komplet kampkunstsystem der er blevet forfinet over århundreder. Mens mange mennesker kun kender Tai Chi som langsomme, meditative bevægelser i parker, indeholder kunsten et sofistikeret kampsystem designet til virkelige selvforsvarssituationer."

  myth_title: "Almindelig Misforståelse"
  myth_text: "Tai Chi er kun langsom træning for afslapning og sundhed"
  reality_title: "Virkeligheden"
  reality_text: "Tai Chi er et komplet kampsystem med ødelæggende kampanvendelser"

  combat_apps_title: "Kampanvendelser"
  combat_apps_intro: "Hver bevægelse i Tai Chi former indeholder flere kampanvendelser. Her er hvad praktisk træning afslører:"

  app1_title: "Ledlåse & Kontrol"
  app1_text: "Subtile håndbevægelser bliver ødelæggende ledmanipulationer der kan kontrollere eller neutralisere en modstander uden slag."
  app2_title: "Skjulte Slag"
  app2_text: "Hvad der ser ud som blid skubben indeholder skjulte slag, albueslag og tryktpunktangreb."
  app3_title: "Kast & Nedtagninger"
  app3_text: "Cirkulære bevægelser omdirigerer modstanderens kraft mens de opsætter fald, fejninger og projiceringsteknikker."
  app4_title: "Forsvarsstrategi"
  app4_text: "Fodarbejde og kropsmekanik tillader dig at undvige angreb mens du samtidig modangriber."
  app5_title: "100g for at overvinde 1000kg"
  app5_text: "Brug en angribers kraft imod dem gennem gearing og timingprincipper."
  app6_title: "Psykologisk Krigsførelse"
  app6_text: "Udvikl ro under pres og lær at læse og forstyrre modstanderes intentioner."

  history_title: "Historisk Kontekst"
  history_battlefield_title: "Fra Slagmark til Park"
  history_battlefield_text: "Tai Chi blev udviklet af kinesiske kampkunstnere der havde brug for at forsvare sig selv i liv-eller-død situationer. Kunsten udviklede sig i en tid hvor kampfærdigheder var essentielle for overlevelse, ikke rekreation."
  history_transformation_title: "Transformationen"
  history_transformation_text: "I det 20. århundrede, da Kina moderniseredes og behovet for personlige kampfærdigheder faldt, blev Tai Chi i stigende grad promoveret for sine sundhedsfordele. Mens disse fordele er reelle og værdifulde, blev kamparven ofte nedtonet eller tabt helt."
  history_preservation_title: "Bevarelse af Den Komplette Kunst"
  history_preservation_text: "Praktisk Tai Chi Chuan træning søger at bevare og undervise det komplette system - sundhed, meditation, filosofi, OG kampeffektivitet. Vi tror at du ikke virkelig kan forstå Tai Chi uden at forstå hvorfor hver bevægelse blev skabt."

  timeline_title: "Udviklings Tidslinje"
  timeline_1: "12.-17. århundrede:"
  timeline_1_text: "Oprindelse i kinesiske kamptraditioner"
  timeline_2: "17.-19. århundrede:"
  timeline_2_text: "Forfining af Chen, Yang, Wu familier"
  timeline_3: "Tidlig 1900-tal:"
  timeline_3_text: "Introduktion til den brede offentlighed"
  timeline_4: "Midt 1900-tal:"
  timeline_4_text: "Sundhedsaspekter understreget frem for kamp"
  timeline_5: "Moderne æra:"
  timeline_5_text: "Genoplivning af praktiske anvendelser"

  philosophy_title: "Vores Træningsfilosofi"
  phil1_title: "Respekt for Tradition"
  phil1_text: "Vi ærer visdommen fra ældgamle mestre mens vi tilpasser træningsmetoder til moderne studerende."
  phil2_title: "Praktisk Anvendelse"
  phil2_text: "Hver teknik skal virke under pres. Vi tester anvendelser gennem kontrolleret sparring og realistiske scenarier."
  phil3_title: "Progressiv Læring"
  phil3_text: "Byg fra basisprincipper til avancerede koncepter. Mestr fundamenter før du forsøger komplekse teknikker."
  phil4_title: "Sind-Krop Integration"
  phil4_text: "Ægte kampfærdigheder kræver koordination af mental intention, fysisk teknik og emotionel balance."

  principles_title: "Kerneprincipper"
  principle1_title: "1. Ting Jin (Lytteenergi)"
  principle1_text: "Udvikl følsomhed til at mærke en modstanders intentioner gennem fysisk kontakt. Forudse og modgå før angreb fuldt udvikles."
  principle2_title: "2. Zhong Ding (Central Balance)"
  principle2_text: "Bevar perfekt balance og rod mens du bevæger dig. En centreret fighter kan ikke let fortrænges eller kontrolleres."
  principle3_title: "3. Yin Yang Teori"
  principle3_text: "Hver handling indeholder dens modsætning. Forstå hvornår du skal give efter og hvornår du skal fremadgå, hvornår du skal være blød og hvornår du skal være fast."

  modern_title: "Hvorfor Lære Praktisk Tai Chi Chuan I Dag?"
  modern1_title: "🛡️ Personlig Sikkerhed"
  modern1_text: "Udvikl reelle selvforsvarsfærdigheder der virker uanset størrelse eller styrkeforskelle."
  modern2_title: "🧘 Stresshåndtering"
  modern2_text: "Lær at forblive rolig og tænke klart under pres - værdifuldt i enhver udfordrende situation."
  modern3_title: "💪 Fysisk Fitness"
  modern3_text: "Byg funktionel styrke, smidighed og koordination gennem naturlige bevægelsesmønstre."
  modern4_title: "🎯 Mental Fokus"
  modern4_text: "Udvikl koncentration og mindfulness der forbedrer præstation i alle områder af livet."
  modern5_title: "🤝 Social Forbindelse"
  modern5_text: "Træn med ligesindede individer i et støttende, respektfuldt miljø."
  modern6_title: "📈 Personlig Vækst"
  modern6_text: "Udfordre dig selv fysisk og mentalt mens du forbinder med ældgamle visdomstraditioner."

  cta_title: "Klar til at Opdage Praktisk Tai Chi Chuan?"
  cta_text: "Oplev den komplette kunst - deltag i en prøvetime"
  cta_try: "Prøv"

